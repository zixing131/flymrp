  <div class="page-layout">
    <div class="tab-view active" id="tab-games">
      <div class="search-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="search" placeholder="搜索游戏" aria-label="搜索游戏" />
      </div>
      <div id="categories" class="categories" role="group" aria-label="游戏类型"></div>
      <p id="library-count" class="library-status" role="status">正在加载游戏库…</p>
      <div class="section-card section-card-games">
        <div id="games"></div>
      </div>
      <p id="empty" hidden>没有找到游戏，换个关键词，或打开自己的 MRP 文件。</p>
    </div>

    <div class="tab-view" id="tab-settings">
      <div class="section-card">
        <div class="section-title">游戏</div>
        <div class="pref-item">
          <span class="pref-label">游戏背景</span>
          <div class="color-picker" id="bgColorPicker">
            <span class="color-dot active" data-color="" title="默认"></span>
            <span class="color-dot" data-color="#6B5CE7" style="background:#6B5CE7" title="紫色"></span>
            <span class="color-dot" data-color="#FF9500" style="background:#FF9500" title="橙色"></span>
            <span class="color-dot" data-color="#FF3B30" style="background:#FF3B30" title="红色"></span>
            <span class="color-dot" data-color="#34C759" style="background:#34C759" title="绿色"></span>
          </div>
        </div>
        <div class="pref-item">
          <span class="pref-label">配置管理</span>
          <div class="button-group">
            <button type="button" class="btn btn-sm" id="export-config">导出配置</button>
            <button type="button" class="btn btn-sm" id="import-config">导入配置</button>
            <button type="button" class="btn btn-sm" id="refresh-library">刷新游戏库</button>
          </div>
        </div>
      </div>

      <div class="section-card">
        <div class="section-title">全局设置</div>
        <div class="pref-item">
          <label class="pref-label" for="theme">界面主题</label>
          <select id="theme">
            <option value="auto">跟随系统</option>
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select>
        </div>
        <div class="pref-item">
          <label class="pref-label" for="resolution">显示尺寸</label>
          <select id="resolution">
            <option value="auto">自动识别</option>
            <option value="176x220">176×220</option>
            <option value="240x320">240×320</option>
            <option value="240x400">240×400</option>
            <option value="320x240">320×240</option>
            <option value="320x480">320×480</option>
            <option value="480x320">480×320</option>
          </select>
        </div>
        <div class="pref-item">
          <label class="pref-label" for="zoom">缩放</label>
          <select id="zoom">
            <option value="auto">适应窗口</option>
            <option value="1">1×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
            <option value="3">3×</option>
            <option value="4">4×</option>
          </select>
        </div>
        <div class="pref-item">
          <label class="pref-label" for="midi-player">音乐播放器</label>
          <select id="midi-player">
            <option value="tinysynth">TinySynth · GM</option>
            <option value="simple">轻量方波</option>
          </select>
        </div>
        <div class="pref-item">
          <label class="pref-label" for="rotation">屏幕旋转</label>
          <select id="rotation">
            <option value="0">不旋转</option>
            <option value="1">右转</option>
            <option value="2">倒置</option>
            <option value="3">左转</option>
          </select>
        </div>
        <div class="pref-item">
          <label class="pref-label" for="speed">运行倍速</label>
          <select id="speed">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
            <option value="3">3×</option>
            <option value="4">4×</option>
          </select>
        </div>
        <div class="pref-item">
          <label class="pref-label" for="keypad-side">键盘位置</label>
          <select id="keypad-side">
            <option value="normal">方向键在左</option>
            <option value="reverse">方向键在右</option>
          </select>
        </div>
        <div class="pref-item">
          <label class="pref-label" for="show-fps">显示 FPS</label>
          <select id="show-fps">
            <option value="true">显示</option>
            <option value="false">隐藏</option>
          </select>
        </div>
      </div>

      <div class="section-card">
        <div class="section-title">本地 MRP</div>
        <p class="section-hint">文件只留在当前浏览器，不会上传到服务器。</p>
        <div class="button-group">
          <button type="button" class="btn btn-primary" id="choose-local">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>选择本地 MRP</span>
          </button>
          <button type="button" class="btn" id="open-player">打开模拟器</button>
        </div>
      </div>

      <div class="section-card">
        <div class="footer-links">
          <a href="https://github.com/zixing131/flymrp">项目源码</a>
          <a href="./about.html">关于作者</a>
          <span>精选 <span id="total-count">100</span></span>
        </div>
      </div>
    </div>
  </div>

          <select id="dsMidi">
            <option value="">游戏默认/全局</option>
            <option value="tinysynth">TinySynth · GM</option>
            <option value="simple">轻量方波</option>
          </select>

        <div class="pref-item">
          <label class="pref-label" for="dsRotation">屏幕旋转</label>
          <select id="dsRotation">
            <option value="">游戏默认/全局</option>
            <option value="0">不旋转</option>
            <option value="1">右转</option>
            <option value="2">倒置</option>
            <option value="3">左转</option>
          </select>
        </div>
        <div class="pref-item">
          <label class="pref-label" for="dsSpeed">运行倍速</label>
          <select id="dsSpeed">
            <option value="">游戏默认/全局</option>

            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
            <option value="3">3×</option>
            <option value="4">4×</option>
          </select>
        </div>
        <div class="pref-item">

          <select id="dsKeypad">
            <option value="">游戏默认/全局</option>

          </select>
        </div>
        <div class="detail-settings-btns">
          <button type="button" class="btn" id="dsReset">恢复游戏默认</button>

        </div>
      </div>
    </div>
    <div class="store-detail-panel" id="storeDetailContent" hidden></div>
  </aside>

  <button type="button" class="fab" id="fab" title="安装游戏">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>

      <div class="gs-row"><label for="gsRotation">屏幕旋转</label><select id="gsRotation"><option value="">游戏默认/全局</option><option value="0">不旋转</option><option value="1">右转</option><option value="2">倒置</option><option value="3">左转</option></select></div>
      <div class="gs-row"><label for="gsSpeed">运行倍速</label><select id="gsSpeed"><option value="">游戏默认/全局</option><option value="0.5">0.5×</option><option value="1">1×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="3">3×</option><option value="4">4×</option></select></div>
      <div class="gs-row"><label for="gsKeypad">键盘位置</label><select id="gsKeypad"><option value="">游戏默认/全局</option><option value="normal">方向键在左</option><option value="reverse">方向键在右</option></select></div>
      <div class="gs-buttons">
        <button type="button" class="btn" id="gsReset">恢复游戏默认</button>
        <button type="button" class="btn btn-primary" id="gsSave">保存</button>
      </div>
    </div>
    <div class="store-sheet" id="storeSheet" hidden>
      <div class="action-sheet-handle"></div>
      <div class="store-sheet-top">
        <div class="store-sheet-title">应用详情</div>
        <button type="button" class="store-sheet-close" id="storeSheetClose" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
        </button>
      </div>
      <div class="store-sheet-scroll" id="storeSheetContent"></div>
    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <button type="button" class="bottom-nav-item active" data-tab="games">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="15" cy="10.5" r="0.8" fill="currentColor" stroke="none"/><circle cx="17.5" cy="13" r="0.8" fill="currentColor" stroke="none"/></svg>
      <span>游戏</span>
    </button>
    <button type="button" class="bottom-nav-item" data-tab="settings">

      <span>设置</span>
    </button>
  </nav>

  <div id="kaios-softkeys" hidden>
    <div id="kaios-soft-left">菜单</div>
    <div id="kaios-soft-center">启动</div>
    <div id="kaios-soft-right">退出</div>
  </div>
  <div id="kaios-menu" hidden>
    <div id="kaios-menu-sheet">
      <div id="kaios-menu-title">菜单</div>
      <div id="kaios-menu-items"></div>
    </div>
  </div>
  <div id="kaios-alert" hidden>
    <div id="kaios-alert-sheet">
      <div id="kaios-alert-title">提示</div>
      <div id="kaios-alert-text"></div>
    </div>
  </div>
  <input id="local-file" type="file" accept=".mrp,.MRP" style="visibility:hidden;display:none" />
  <input id="config-file" type="file" accept="application/json,.json" style="visibility:hidden;display:none" />
  <script type="module" src="./catalog.ts"></script>
</body>
